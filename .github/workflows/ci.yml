# Verification that runs on every push and pull request.
#
# Nothing here deploys. The whole stack — frontend, backend, postgres — is brought
# up by hand with docker compose on the campus server (see docs/DEPLOYMENT.md).
# The point of these jobs is to fail *before* that happens.
#
# Each job installs from a clean checkout with `npm ci`, so a dependency that
# only works locally because it is already sitting in node_modules is caught here
# rather than during a rebuild on the server.

name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch makes the running one irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches backend/Dockerfile and local development.
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      # Build separately from typecheck: this is what produces dist/, and it is
      # the step the Docker image actually runs.
      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`, so this covers
      # typechecking too. It mirrors the build stage of frontend/Dockerfile.
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Container images build and pass their runtime checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches Dockerfile-only breakage the backend job cannot see — notably the
      # runtime stage copying src/db/schema.sql into dist/, which tsc does not
      # carry across and which fails at container start rather than at build.
      - name: Build backend image
        run: docker build -t borobudur-backend:ci ./backend

      - name: Verify schema.sql reached the image
        run: |
          docker run --rm --entrypoint sh borobudur-backend:ci \
            -c 'test -f dist/db/schema.sql && test -f dist/index.js && echo "runtime layout OK"'

      # The frontend image bakes VITE_API_BASE_URL at build time. If the build arg
      # fails to reach Vite the bundle silently falls back to localhost:3001 and
      # every user's browser calls its own machine, so assert it is absent.
      - name: Build frontend image
        run: docker build -t borobudur-frontend:ci ./frontend

      - name: Verify the bundle has no absolute API base
        run: |
          docker run --rm --entrypoint sh borobudur-frontend:ci -c '
            grep -rq "localhost:3001" /usr/share/nginx/html/assets/ && {
              echo "FAIL: bundle contains localhost:3001"; exit 1; }
            grep -rq "/api/heatmap/aggregate" /usr/share/nginx/html/assets/ || {
              echo "FAIL: API paths missing from bundle"; exit 1; }
            echo "bundle API base OK"'

      - name: Verify nginx config parses
        run: docker run --rm borobudur-frontend:ci nginx -t
