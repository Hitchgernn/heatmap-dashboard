# Serves the built dashboard and proxies the API from the same origin.
#
# Same-origin is the point: the browser sees one host for both the app and
# /api/*, so the session cookie stays SameSite=Strict and no CORS is involved.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Without a resolver nginx caches the backend's IP at
    # startup, so a `docker compose up -d backend` that gives the container a new
    # address leaves this proxy sending traffic to a dead IP until nginx is
    # restarted too. Re-resolving every 10s avoids that 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a browser keeps loading old asset
    # names after a redeploy and the page fails to boot.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths render the SPA rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # proxy_pass with a variable forces runtime DNS resolution (see resolver
        # above), but it also stops nginx forwarding the original URI on its own,
        # so $request_uri is appended explicitly.
        set $upstream http://backend:3001;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aggregating a wide time window can take a while on a cold window.
        proxy_read_timeout 120s;
    }

    # The backend mounts /health outside /api so infrastructure probes need no
    # session; expose it here for the tunnel and for uptime checks.
    location = /health {
        set $upstream_health http://backend:3001;
        proxy_pass $upstream_health$request_uri;
        access_log off;
    }
}
