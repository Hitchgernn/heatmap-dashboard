<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!--
    16px slice of favicon.ico only — not shipped to the browser directly.
    Drawn on a 16-unit grid so every edge lands on a whole pixel: at this size the
    1.6-unit gaps in favicon.svg fall below half a pixel and the terraces blur into
    one blob, so this variant drops to two terraces with full 1px gaps and a 1px
    spire. Regenerate favicon.ico with scripts/build-favicon.sh after editing.
  -->
  <rect width="16" height="16" rx="3.5" fill="#111827"/>
  <g fill="#e8973a">
    <rect x="7.5" y="1" width="1" height="3.5"/>
    <path d="M5.5 6.5 C5.5 3.4 10.5 3.4 10.5 6.5 Z"/>
    <polygon points="4,9.5 12,9.5 11.3,7.5 4.7,7.5"/>
    <polygon points="2,13 14,13 13.2,10.5 2.8,10.5"/>
  </g>
</svg>
