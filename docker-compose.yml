# Infrastructure for the Borobudur dashboard.
#
# PostgreSQL holds admin auth only; location data stays in Hyperbase (external
# BaaS), reached by the backend over REST.
#
# The frontend container serves the built dashboard AND proxies /api to the
# backend, so the browser sees a single origin. That keeps the session cookie
# SameSite=Strict and removes CORS from the picture entirely — only the frontend
# port needs to be reachable from outside.
#
# Bring up everything:  docker compose up -d --build
# Database only (local dev against `npm run dev`):
#                       docker compose up -d postgres
#
# The schema in backend/src/db/schema.sql is auto-applied on first init (empty
# volume). For an existing volume, apply it manually — see docs/DEPLOYMENT.md.
#
# SHARED HOSTS: an explicit project name namespaces every container, network and
# volume created here, so this stack cannot collide with unrelated ones. On the
# deployment server there are already `borobudur_backend` and `borobudur_db`
# containers belonging to the mobile app and another project — nothing below
# touches them. Published host ports are the one genuinely shared resource, so
# both are overridable and neither uses a default that is commonly taken.

name: borobudur-dashboard

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-borobudur}
      POSTGRES_PASSWORD: ${PGPASSWORD:-borobudur}
      POSTGRES_DB: ${PGDATABASE:-borobudur_auth}
    # Loopback only, and NOT on 5432: that port is frequently already taken by
    # another Postgres, and a 0.0.0.0 binding elsewhere blocks a loopback one
    # here (EADDRINUSE). The backend does not use this mapping at all — it
    # reaches Postgres by service name over the compose network. It exists
    # solely so `psql`/`npm run dev` on the host can connect; override with
    # PG_PUBLISH_PORT, or delete these two lines if you never need that.
    ports:
      - "127.0.0.1:${PG_PUBLISH_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-borobudur} -d ${PGDATABASE:-borobudur_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever backend/.env says, because inside the container
      # 127.0.0.1 is the container itself, not the host. `postgres` resolves to
      # the service above over the compose network. Compose gives `environment`
      # precedence over `env_file`, so one .env serves both local dev and here.
      PGHOST: postgres
      PGPORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback only, and not strictly required: the frontend container reaches
    # the backend over the compose network. Published for direct curl access
    # during setup and debugging. Override with BACKEND_PUBLISH_PORT.
    ports:
      - "127.0.0.1:${BACKEND_PUBLISH_PORT:-3001}:3001"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty on purpose — the client calls /api on whatever origin served the
        # page, which this same container proxies to the backend. Baked in at
        # build time, so changing it needs `up -d --build frontend`.
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    # The only port that needs to be reachable from outside the host: point the
    # cloudflared tunnel (or an existing reverse proxy) here. 8090 avoids the
    # ports commonly taken on a shared host; override with FRONTEND_PUBLISH_PORT.
    ports:
      - "127.0.0.1:${FRONTEND_PUBLISH_PORT:-8090}:80"

volumes:
  postgres_data:
