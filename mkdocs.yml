site_name: Borobudur Heatmap Dashboard
site_description: >-
  Documentation and project blueprint for the Borobudur visitor-density
  heatmap dashboard.
site_url: https://hitchgernn.github.io/heatmap-dashboard/
repo_url: https://github.com/Hitchgernn/heatmap-dashboard
repo_name: Hitchgernn/heatmap-dashboard
edit_uri: edit/master/docs/

docs_dir: docs

# docs/superpowers/ holds agent plans and specs — working notes, not project
# documentation. Without this they would be published alongside the real docs.
exclude_docs: |
  superpowers/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Mermaid blocks are handed to mermaid.js instead of being highlighted as code.
  # Material ships the mermaid loader itself — no extra plugin or CDN tag needed.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: en

# Live docs come first. Everything under "Archive" is superseded or finished
# work, kept for history — each of those pages opens with a banner saying so.
nav:
  - Home: index.md
  - Project Blueprint: BLUEPRINT.md
  - Technical Reference:
      - Architecture: ARCHITECTURE.md
      - API Reference: API.md
      - Data Flows: DATA_FLOWS.md
      - Hyperbase Schema: HYPERBASE_SCHEMA.md
  - Operations:
      - Deployment: DEPLOYMENT.md
      - Further Development: FURTHER_DEVELOPMENT.md
  - Archive:
      - Original PRD: PRD.md
      - Implementation Plan: IMPLEMENTATION_PLAN.md
      - Hyperbase Integration: HYPERBASE_INTEGRATION.md
      - Hyperbase Auth: HYPERBASE_AUTH_INTEGRATION.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Hitchgernn/heatmap-dashboard
